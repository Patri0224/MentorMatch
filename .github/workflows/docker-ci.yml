name: Docker CI

on:
  push:
    branches: [ "main", "devops", "devOps", "devops-ci" ]
  pull_request:

jobs:
  docker-build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t mentor-match ./backend

      - name: Run container
        run: docker run -d --name mentor-match -p 3000:3000 -e PORT=3000 mentor-match

      - name: Smoke test
        run: |
          for i in {1..30}; do
            if curl -sS http://localhost:3000/health > /dev/null; then
              echo "OK"
              exit 0
            fi
            sleep 1
          done
          docker logs mentor-match
          exit 1
