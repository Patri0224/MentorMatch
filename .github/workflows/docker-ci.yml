name: Docker CI

on:
  push:
    branches: [ "main", "devops", "devOps", "devops-ci" ]
  pull_request:

jobs:
  docker-build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t mentor-match ./backend

      - name: Run container
        run: docker run -d --name mentor-match -p 3000:3000 -e PORT=3000 mentor-match

      - name: Smoke test (wait for server)
        run: |
          echo "Waiting for server..."
          for i in {1..60}; do
            if curl -sS http://localhost:3000/health > /dev/null; then
              echo "Server responding"
              exit 0
            fi
            echo "Not up yet..."
            sleep 2
          done
          echo "Server did not respond"
          docker logs mentor-match
          exit 1
      - name: Check container status
        run: |
          docker ps -a
          docker logs mentor-match


