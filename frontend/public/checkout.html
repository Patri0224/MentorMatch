<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <title>Checkout - MentorMatch</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/custom.css">
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
    <link rel="alternate icon" type="image/x-icon" href="favicon.ico">
    <script src="assets/js/theme.js"></script>
    <script>
        (function () {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-bs-theme', savedTheme);
        })();
    </script>
</head>

<body class="bg-body-tertiary">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm border-0 p-4">
                    <h3 class="fw-bold mb-4">Riepilogo Ordine</h3>

                    <div id="checkoutDetails" class="mb-4">
                        <div class="d-flex justify-content-between mb-2">
                            <span>Sessione con <strong id="sumMentor">...</strong></span>
                            <span id="sumDate">...</span>
                        </div>
                        <div class="d-flex justify-content-between border-top pt-2">
                            <span class="fw-bold">Totale da pagare:</span>
                            <span class="fw-bold text-success h4" id="sumAmount">0.00€</span>
                        </div>
                    </div>

                    <div class="d-grid gap-2">
                        <button id="payButton" class="btn btn-primary btn-lg fw-bold">
                            Procedi al Pagamento <i class="bi bi-stripe ms-2"></i>
                        </button>
                        <a href="dashboard.html" class="btn btn-link text-muted">Annulla e torna alla dashboard</a>
                    </div>

                    <div class="mt-4 text-center">
                        <small class="text-muted">
                            <i class="bi bi-shield-lock-fill"></i> Pagamento sicuro elaborato da <strong>Stripe</strong>
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="src/js/api.js"></script>
    <script src="src/js/pages/checkout.js"></script>
</body>

</html>
