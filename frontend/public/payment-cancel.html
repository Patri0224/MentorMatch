<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento Annullato - MentorMatch</title>
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
    <link rel="alternate icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/custom.css">
    <script src="assets/js/theme.js"></script>
    <script>
        (function () {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-bs-theme', savedTheme);
        })();
    </script>
</head>

<body class="bg-body-tertiary d-flex align-items-center vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 text-center">
                <div class="card shadow-lg border-0 p-5 rounded-4">
                    <div class="mb-4">
                        <i class="bi bi-x-circle-fill text-danger" style="font-size: 5rem;"></i>
                    </div>
                    <h2 class="fw-bold">Pagamento non riuscito</h2>
                    <p class="text-muted mb-4">L'operazione è stata annullata o il metodo di pagamento è stato
                        rifiutato. La tua prenotazione rimane in sospeso.</p>

                    <div class="d-grid gap-2">
                        <button onclick="history.back()" class="btn btn-primary btn-lg fw-bold">Riprova il
                            pagamento</button>
                        <a href="dashboard.html" class="btn btn-outline-secondary">Torna alla Dashboard</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
